name: Validate Clique genesis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  genesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate retained genesis invariants
        run: python scripts/validate_genesis.py
